<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>注音輸入法手感測試鍵盤</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --ios-bg: #eceef0;
      --ios-key-bg: #ffffff;
      --ios-key-active: #b4b8be;
      --ios-action-bg: #adb3bc;
      --ios-action-active: #8f96a1;
      --ios-key-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      --ios-text: #111827;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #1a1c23;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Microsoft JhengHei", sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* iPhone Max 430px container centered */
    #phone-container {
      width: 100vw;
      max-width: 430px;
      height: 100vh;
      height: 100dvh;
      background: #f7f8fa;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    /* Key press visual feedback */
    .key-btn {
      transition: background-color 0.04s ease, transform 0.04s ease;
      box-shadow: var(--ios-key-shadow);
      border-radius: 5px;
      touch-action: none;
    }

    .key-btn:active, .key-btn.is-pressed {
      background-color: var(--ios-key-active) !important;
      transform: scale(0.96);
    }

    .action-key {
      background-color: var(--ios-action-bg);
      color: #1f2937;
    }

    .action-key:active, .action-key.is-pressed {
      background-color: var(--ios-action-active) !important;
    }

    /* Custom candidate bar scroll */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Blinking text caret */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .caret {
      animation: blink 1s infinite;
      display: inline-block;
      width: 2px;
      height: 1.15em;
      background-color: #007aff;
      vertical-align: -0.15em;
      margin-left: 1px;
    }
  </style>
</head>
<body class="antialiased">

  <!-- Main Mobile Container -->
  <div id="phone-container">
    <!-- Top Bar: Diagnostics & Export -->
    <header class="px-3 py-2 bg-white/90 backdrop-blur border-b border-gray-200 flex items-center justify-between z-10 shrink-0">
      <div class="flex items-center gap-1.5">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-xs font-semibold text-gray-700 tracking-tight">注音手感測試</span>
        <span id="log-count" class="text-[10px] bg-gray-100 text-gray-500 font-mono px-1.5 py-0.5 rounded">0 點擊</span>
      </div>
      <div class="flex items-center gap-1">
        <button id="btn-clear" class="text-xs text-gray-500 active:text-gray-900 px-2 py-1 rounded hover:bg-gray-100">
          清空
        </button>
        <button id="btn-export" class="text-xs font-medium text-blue-600 active:text-blue-800 bg-blue-50 px-2.5 py-1 rounded border border-blue-200">
          匯出記錄
        </button>
      </div>
    </header>

    <!-- Read-only Text Output Area (Anchored to top, flex-col start) -->
    <main id="output-container" class="flex-1 min-h-0 p-3 bg-white overflow-y-auto flex flex-col justify-start items-start text-left break-words">
      <div id="output-wrapper" class="w-full text-gray-900 text-lg sm:text-xl font-normal leading-relaxed tracking-wide select-none">
        <span id="committed-text"></span><span id="composing-text" class="text-blue-600 bg-blue-50 px-1 py-0.5 rounded border border-blue-200 font-medium"></span><span class="caret"></span>
      </div>
      <p class="text-[11px] text-gray-400 mt-2 shrink-0 select-none border-t border-gray-100 pt-1.5 w-full">
        提示：空白鍵＝一聲／選字；⌫＝退格；依序輸入聲母、介音、韻母、聲調（˙ˊˇˋ）。
      </p>
    </main>

    <!-- Candidate Bar (iOS Style, sticky above keyboard) -->
    <div id="candidate-bar" class="h-10 bg-[#e3e5e9] border-t border-b border-gray-300 flex items-center px-2 overflow-x-auto no-scrollbar gap-1 shrink-0 z-10">
      <span class="text-xs text-gray-400 italic px-2">無候選字</span>
    </div>

    <!-- Keyboard Area (Authentic iOS Bopomofo 4 rows + function row) -->
    <div id="keyboard-wrapper" class="bg-[#d1d5db] pt-1.5 pb-2 px-1 select-none shrink-0" style="padding-bottom: max(8px, env(safe-area-inset-bottom));">
      <div id="keyboard-grid" class="flex flex-col gap-1.5 w-full">
        <!-- Row 1: 11 keys -->
        <div class="flex gap-1 w-full justify-between h-[42px]" data-row="1">
          <!-- ㄅ ㄉ ˇ ˋ ㄓ ˊ ˙ ㄚ ㄞ ㄢ ㄦ -->
        </div>

        <!-- Row 2: 10 keys -->
        <div class="flex gap-1 w-full justify-between h-[42px]" data-row="2">
          <!-- ㄆ ㄊ ㄍ ㄐ ㄔ ㄒ ㄧ ㄛ ㄟ ㄣ -->
        </div>

        <!-- Row 3: 10 keys -->
        <div class="flex gap-1 w-full justify-between h-[42px]" data-row="3">
          <!-- ㄇ ㄋ ㄎ ㄑ ㄕ ㄘ ㄨ ㄜ ㄠ ㄤ -->
        </div>

        <!-- Row 4: 9 keys + Backspace -->
        <div class="flex gap-1 w-full justify-between h-[42px]" data-row="4">
          <!-- ㄈ ㄌ ㄏ ㄒ ㄖ ㄙ ㄩ ㄝ ㄡ ㄥ + ⌫ -->
        </div>

        <!-- Row 5: Action keys & Spacebar -->
        <div class="flex gap-1 w-full justify-between h-[42px]" data-row="5">
          <!-- 123 | 表情符號 | 空白鍵 | 換行 -->
        </div>
      </div>
    </div>
  </div>

  <!-- Export Modal -->
  <div id="export-modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl max-w-sm w-full p-4 flex flex-col gap-3 max-h-[85vh]">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-semibold text-gray-800 text-base">觸控按鍵記錄 (Telemetry JSON)</h3>
        <button id="modal-close-btn" class="text-gray-400 hover:text-gray-600 text-lg font-bold px-1">&times;</button>
      </div>
      <p class="text-xs text-gray-500">
        已記錄每一筆按下的 timestamp、pointerId、螢幕絕對座標 (clientX, clientY) 與命中按鍵。
      </p>
      <textarea id="json-preview" readonly class="w-full flex-1 min-h-[180px] text-[11px] font-mono bg-gray-50 border border-gray-200 rounded p-2 text-gray-700 overflow-y-auto"></textarea>
      <div class="flex gap-2">
        <button id="btn-copy-json" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-800 text-xs font-medium py-2 rounded">
          複製 JSON
        </button>
        <button id="btn-download-json" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium py-2 rounded">
          下載檔案
        </button>
      </div>
    </div>
  </div>

  <!-- Notification Toast -->
  <div id="toast" class="pointer-events-none fixed bottom-16 left-1/2 -translate-x-1/2 bg-gray-900/90 text-white text-xs px-3 py-1.5 rounded-full opacity-0 transition-opacity duration-300 z-50">
    已複製到剪貼簿
  </div>

      const grid = document.getElementById('keyboard-grid');

          } else if (key === '123') {
            btn.className = 'key-btn action-key flex-[1.5] flex items-center justify-center text-xs font-semibold cursor-pointer';
            btn.textContent = '123';
          } else if (key === 'EMOJI') {
            btn.className = 'key-btn action-key flex-[1.2] flex items-center justify-center text-lg cursor-pointer';
            btn.textContent = '🌐';
          } else if (key === 'RETURN') {
            btn.className = 'key-btn action-key flex-[2] flex items-center justify-center text-xs font-semibold text-gray-800 cursor-pointer';
            btn.textContent = '換行';

            btn.className = 'key-btn bg-white flex-1 flex items-center justify-center text-[17px] font-normal text-gray-900 cursor-pointer';
            btn.textContent = key;
          }

          rowElement.appendChild(btn);
        });
      });
    }

    function updateDisplay() {
      document.getElementById('committed-text').textContent = committedText;
      document.getElementById('composing-text').textContent = composingBuffer;
      renderCandidates();
      
      // Auto-scroll output area to bottom
      const outputMain = document.getElementById('output-container');
      if (outputMain) {
        outputMain.scrollTop = outputMain.scrollHeight;
      }
    }

    function renderCandidates() {
      const candidateBar = document.getElementById('candidate-bar');
      candidateBar.innerHTML = '';

      if (!composingBuffer) {
        candidateBar.innerHTML = '<span class="text-xs text-gray-400 italic px-2">無候選字</span>';
        return;
      }

      let matches = [];

      // Exact match in dictionary
      if (PHONETIC_DICT[composingBuffer]) {
        matches = [...PHONETIC_DICT[composingBuffer]];
      }

      // Check tone 1 (if no tone entered yet)
      const hasTone = Array.from(composingBuffer).some(c => TONES.has(c));
      if (!hasTone) {
        if (PHONETIC_DICT[composingBuffer] && !matches.includes(PHONETIC_DICT[composingBuffer][0])) {
          matches.push(...PHONETIC_DICT[composingBuffer]);
        }
      }

      // Prefix / Fallback: check first character
      const firstChar = composingBuffer[0];
      if (BOPOMOFO_SINGLE_MAP[firstChar]) {
        BOPOMOFO_SINGLE_MAP[firstChar].forEach(word => {
          if (!matches.includes(word)) matches.push(word);
        });
      }

      // If still empty, supply the raw Bopomofo buffer as option
      if (matches.length === 0) {
        matches.push(composingBuffer);
      }

      // Render candidates buttons
      matches.slice(0, 12).forEach((word, index) => {
        const item = document.createElement('button');
        item.className = 'candidate-item px-3 py-1 bg-white hover:bg-gray-100 active:bg-gray-200 rounded text-[16px] text-gray-900 font-medium shrink-0 shadow-sm border border-gray-200 transition';
        item.textContent = word;
        item.dataset.index = index;
        
        // Touch selection
        item.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          selectCandidate(word);
        });

        candidateBar.appendChild(item);
      });
    }

    function selectCandidate(word) {
      committedText += word;
      composingBuffer = "";
      updateDisplay();
    }

    function handleKeyPress(key) {
      if (ALL_BOPOMOFO.has(key)) {
        if (TONES.has(key)) {
          // If tone is pressed without base, still append or tone-mark
          composingBuffer += key;
          // When a tone is entered, check if an exact syllable can auto-resolve
          if (PHONETIC_DICT[composingBuffer] && PHONETIC_DICT[composingBuffer].length > 0) {
            // First candidate automatically ready or stay in candidate bar for picking
            // In iOS, entering tone immediately narrows candidates; first space or touch commits
          }
        } else {
          composingBuffer += key;
        }
      } else if (key === 'SPACE') {
        // Spacebar acts as tone 1 or commits first candidate
        if (composingBuffer.length > 0) {
          // Try tone 1 match
          const candidates = PHONETIC_DICT[composingBuffer] || BOPOMOFO_SINGLE_MAP[composingBuffer[0]] || [composingBuffer];
          selectCandidate(candidates[0]);
        } else {
          // Normal space character
          committedText += ' ';
        }
      } else if (key === 'BACKSPACE') {
        if (composingBuffer.length > 0) {
          // Delete last Bopomofo symbol
          composingBuffer = composingBuffer.slice(0, -1);
        } else if (committedText.length > 0) {
          // Delete last committed character
          committedText = committedText.slice(0, -1);
        }
      } else if (key === 'RETURN') {
        if (composingBuffer.length > 0) {
          // Commit raw symbols without converting
          committedText += composingBuffer;
          composingBuffer = "";
        } else {
          committedText += "\n";
        }
      } else if (key === '123') {
        // Toggle numeric feedback
        showToast('切換符號模式 (原型測試)');
      } else if (key === 'EMOJI') {
        showToast('表情符號 (原型測試)');
      }

      updateDisplay();
    }

    function logKeyTouch(pointerEvent, keyElement, keyName) {
      const rect = keyElement.getBoundingClientRect();
      const relativeX = Math.round(pointerEvent.clientX - rect.left);
      const relativeY = Math.round(pointerEvent.clientY - rect.top);

      const record = {
        id: telemetryLogs.length + 1,
        timestamp: Date.now(),
        timeISO: new Date().toISOString(),
        pointerId: pointerEvent.pointerId,
        pointerType: pointerEvent.pointerType,
        key: keyName,
        point: {
          clientX: Math.round(pointerEvent.clientX),
          clientY: Math.round(pointerEvent.clientY)
        },
        keyRect: {
          x: Math.round(rect.x),
          y: Math.round(rect.y),
          width: Math.round(rect.width),
          height: Math.round(rect.height)
        },
        offsetInKey: {
          x: relativeX,
          y: relativeY
        }
      };

      telemetryLogs.push(record);
      document.getElementById('log-count').textContent = `${telemetryLogs.length} 點擊`;
    }

    function setupPointerHandling() {
      const keyboardGrid = document.getElementById('keyboard-grid');

      // Prevent system touches, scrolling and default gestures
      const preventDefaults = (e) => {
        e.preventDefault();
      };
      
      keyboardGrid.addEventListener('touchstart', preventDefaults, { passive: false });
      keyboardGrid.addEventListener('touchmove', preventDefaults, { passive: false });
      keyboardGrid.addEventListener('touchend', preventDefaults, { passive: false });

      // Pointer Down: Visual feedback & trigger typing immediately for lowest latency
      keyboardGrid.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        const keyBtn = e.target.closest('.key-btn');
        if (!keyBtn) return;

        const key = keyBtn.dataset.key;
        activePointers.set(e.pointerId, {
          targetBtn: keyBtn,
          startX: e.clientX,
          startY: e.clientY,
          key: key
        });

        // Add press visual style
        keyBtn.classList.add('is-pressed');

        // Log touch telemetry
        logKeyTouch(e, keyBtn, key);

        // Execute input logic
        handleKeyPress(key);
      }, { passive: false });

      // Pointer Up: Release visual feedback
      const handlePointerUp = (e) => {
        if (activePointers.has(e.pointerId)) {
          const info = activePointers.get(e.pointerId);
          if (info.targetBtn) {
            info.targetBtn.classList.remove('is-pressed');
          }
          activePointers.delete(e.pointerId);
        }
      };

      window.addEventListener('pointerup', handlePointerUp);
      window.addEventListener('pointercancel', handlePointerUp);
    }

    function setupControls() {
      // Clear button
      document.getElementById('btn-clear').addEventListener('click', () => {
        committedText = "";
        composingBuffer = "";
        updateDisplay();
      });

      // Export Modal
      const modal = document.getElementById('export-modal');
      const jsonPreview = document.getElementById('json-preview');

      document.getElementById('btn-export').addEventListener('click', () => {
        const payload = {
          device: {
            userAgent: navigator.userAgent,
            screenWidth: window.innerWidth,
            screenHeight: window.innerHeight,
            devicePixelRatio: window.devicePixelRatio
          },
          totalClicks: telemetryLogs.length,
          logs: telemetryLogs
        };

        jsonPreview.value = JSON.stringify(payload, null, 2);
        modal.classList.remove('hidden');
      });

      document.getElementById('modal-close-btn').addEventListener('click', () => {
        modal.classList.add('hidden');
      });

      // Close modal on click outside
      modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.classList.add('hidden');
      });

      // Copy JSON button (uses document.execCommand fallback for iframe safety)
      document.getElementById('btn-copy-json').addEventListener('click', () => {
        jsonPreview.select();
        try {
          document.execCommand('copy');
          showToast('JSON 已複製到剪貼簿！');
        } catch (err) {
          showToast('複製失敗，請手動全選複製');
        }
      });

      // Download JSON button
      document.getElementById('btn-download-json').addEventListener('click', () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(jsonPreview.value);
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `bopomofo_telemetry_${Date.now()}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showToast('已開始下載 JSON 記錄檔');
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 1800);
    }

    window.onload = function() {
      buildKeyboard();
      setupPointerHandling();
      setupControls();
      updateDisplay();
    };
  </script>
</body>
</html>
