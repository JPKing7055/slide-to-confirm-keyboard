<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>注音上滑確認輸入測試</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--sub:#64748b;--key:#f1f5f9;--strip:#e2e8f0;--bd:#e2e8f0;--dbg:#0f172a;--pop:rgba(30,41,59,.92);--mi:#fff;--mt:#334155;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--sub:#94a3b8;--key:#334155;--strip:#0f172a;--bd:#334155;--dbg:#020617}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Noto Sans TC",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.top{padding:12px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px}
#dbg{background:var(--dbg);color:#34d399;font:12px monospace;line-height:1.6}
#dbg b{color:#fde047}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}
.row input{width:55%}
#out{font-size:24px;font-weight:700;min-height:36px;word-break:break-all}
button{border:0;border-radius:6px;padding:6px 12px;font-weight:700;background:var(--key);color:var(--tx)}
.bar{display:flex;justify-content:center;padding:12px 4px 20px;border-top:1px solid var(--bd);background:var(--card)}
#strip{display:flex;flex-direction:column;width:100%;gap:3px;padding:4px;background:var(--strip);border-radius:8px}
.kr{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.k{min-width:0;height:48px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;border-radius:6px;background:var(--key)}
.k.del{color:#dc2626}
.pop{position:fixed;z-index:9999;pointer-events:none;display:flex;gap:6px;padding:8px;background:var(--pop);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.mi{width:64px;height:64px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;border-radius:12px;background:var(--mi);color:var(--mt)}
.mi.on{background:#3b82f6;color:#fff;transform:scale(1.08)}
</style>
</head>
<body>
<div class="top">
  <div id="dbg" class="card">
    <div>事件：<span id="d-ev">無</span></div>
    <div>進行中的筆劃：<b id="d-st">無</b></div>
    <div>手指座標：<span id="d-xy">0, 0</span></div>
  </div>
  <div class="card">
    <div class="row"><span>放大字中心離所按列上緣 <b id="v-dist">70px</b></span><input id="dist" type="range" min="40" max="140" step="5" value="70"></div>
    <div class="row" style="margin-top:6px"><span>中心判定範圍 <b id="v-zone">50%</b></span><input id="zone" type="range" min="20" max="100" step="5" value="50"></div>
  </div>
  <div class="card row">
    <div style="flex:1"><div style="color:var(--sub);margin-bottom:4px">輸出文字區：</div><div id="out"></div></div>
    <button id="clear">清空</button>
  </div>
  <div class="card" style="font-size:12px;color:var(--sub);line-height:1.6">
    操作：一般點按會直接輸入手指下最接近的鍵（放開時輸入）。若想確認，按住後往上滑到放大字的中心，進入中心就立刻輸入。兩隻手可同時各做一筆。
  </div>
</div>

<div class="bar"><div id="strip"></div></div>

<script>
const LAYOUT=[
 ['ㄅ','ㄉ','ˇ','ˋ','ㄓ','ˊ','˙','ㄚ','ㄞ','ㄢ','ㄦ'],
 ['ㄆ','ㄊ','ㄍ','ㄐ','ㄔ','ㄗ','ㄧ','ㄛ','ㄟ','ㄣ'],
 ['ㄇ','ㄋ','ㄎ','ㄑ','ㄕ','ㄘ','ㄨ','ㄜ','ㄠ','ㄤ'],
 ['ㄈ','ㄌ','ㄏ','ㄒ','ㄖ','ㄙ','ㄩ','ㄝ','ㄡ','ㄥ']];
const MAX_STROKES=2;
const $=id=>document.getElementById(id);
const strip=$('strip'), out=$('out');
let dist=70, zone=.5, rows=[];
const strokes=new Map();

$('dist').oninput=e=>{dist=+e.target.value;$('v-dist').textContent=dist+'px'};
$('zone').oninput=e=>{zone=+e.target.value/100;$('v-zone').textContent=e.target.value+'%'};
$('clear').onclick=()=>out.textContent='';

function init(){
  LAYOUT.forEach((keys,ri)=>{
    const r=document.createElement('div');r.className='kr';
    for(let i=0;i<11;i++){
      const d=document.createElement('div');
      if(i<keys.length){d.className='k';d.textContent=keys[i]}
      else if(ri===3){
        d.className='k del';d.textContent='⌫';
        d.addEventListener('pointerdown',e=>{e.stopPropagation();out.textContent=out.textContent.slice(0,-1)});
      }
      r.appendChild(d);
    }
    strip.appendChild(r);
  });
  measure();
}
function measure(){
  rows=[...strip.querySelectorAll('.kr')].map((rowEl,ri)=>{
    const rr=rowEl.getBoundingClientRect();
    return{top:rr.top,bottom:rr.bottom,keys:[...rowEl.querySelectorAll('.k:not(.del)')].map((el,i)=>{const r=el.getBoundingClientRect();return{key:LAYOUT[ri][i],c:r.left+r.width/2}})};
  });
}
function pickRow(y){
  let best=rows[0],bd=1e9;
  rows.forEach(r=>{const d=y<r.top?r.top-y:y>r.bottom?y-r.bottom:0;if(d<bd){bd=d;best=r}});
  return best;
}
function nearestFour(x,row){
  const s=[...row.keys].sort((a,b)=>Math.abs(a.c-x)-Math.abs(b.c-x));
  const near=s[0].key;
  const four=s.slice(0,4).sort((a,b)=>a.c-b.c);
  return{keys:four.map(k=>k.key),idx:Math.max(0,four.findIndex(k=>k.key===near))};
}
function buildPopup(st,x,y){
  const row=pickRow(y);
  const {keys,idx}=nearestFour(x,row);
  st.keys=keys;st.idx=idx;st.active=keys[idx];
  const p=document.createElement('div');p.className='pop';
  st.items=keys.map((k,i)=>{const d=document.createElement('div');d.className='mi'+(i===idx?' on':'');d.textContent=k;p.appendChild(d);return d});
  document.body.appendChild(p);
  const pr=p.getBoundingClientRect(), it=st.items[idx];
  let left=x-(it.offsetLeft+it.offsetWidth/2);
  left=Math.max(8,Math.min(left,innerWidth-pr.width-8));
  const top=row.top-dist-pr.height/2;
  p.style.left=left+'px';p.style.top=Math.max(4,top)+'px';
  st.pop=p;st.left=left;st.top=Math.max(4,top);
}
function setActive(st,i){
  st.idx=i;st.active=st.keys[i];
  st.items.forEach((d,j)=>d.classList.toggle('on',j===i));
}
function update(st,x,y){
  // 依手指水平位置，高亮最近的放大字
  let best=0,bd=1e9;
  st.items.forEach((d,i)=>{const cx=st.left+d.offsetLeft+d.offsetWidth/2;const dd=Math.abs(x-cx);if(dd<bd){bd=dd;best=i}});
  if(best!==st.idx)setActive(st,best);
  // 進入放大字中心就立刻輸入
  const d=st.items[best];
  const cx=st.left+d.offsetLeft+d.offsetWidth/2;
  const cy=st.top+st.pop.offsetHeight/2;
  if(Math.abs(x-cx)<=d.offsetWidth*zone/2&&Math.abs(y-cy)<=d.offsetHeight*zone/2){
    out.textContent+=st.active;
    st.done=true;
    st.pop.remove();st.pop=null;
  }
}
function show(){
  const a=[...strokes.values()].map(s=>s.done?'已輸入':'候選['+s.active+']');
  $('d-st').textContent=a.length?a.join(' ｜ '):'無';
}

strip.addEventListener('pointerdown',e=>{
  if(e.target.closest('.del'))return;
  if(strokes.size>=MAX_STROKES||strokes.has(e.pointerId))return;
  strip.setPointerCapture(e.pointerId);
  measure();
  const st={done:false,pop:null,keys:[],items:[],idx:0,active:null,left:0,top:0};
  strokes.set(e.pointerId,st);
  buildPopup(st,e.clientX,e.clientY);
  $('d-ev').textContent='pointerdown #'+e.pointerId;
  $('d-xy').textContent=Math.round(e.clientX)+', '+Math.round(e.clientY);
  show();
});
strip.addEventListener('pointermove',e=>{
  const st=strokes.get(e.pointerId);if(!st)return;
  $('d-ev').textContent='pointermove #'+e.pointerId;
  $('d-xy').textContent=Math.round(e.clientX)+', '+Math.round(e.clientY);
  if(!st.done)update(st,e.clientX,e.clientY);
  show();
});
function finish(e,commit){
  const st=strokes.get(e.pointerId);if(!st)return;
  // 沒上滑到中心就放開 = 一般點按，輸入目前高亮的鍵
  if(commit&&!st.done&&st.active)out.textContent+=st.active;
  if(st.pop)st.pop.remove();
  try{strip.releasePointerCapture(e.pointerId)}catch(_){}
  strokes.delete(e.pointerId);
  $('d-ev').textContent=(commit?'pointerup':'pointercancel')+' #'+e.pointerId;
  show();
}
strip.addEventListener('pointerup',e=>finish(e,true));
strip.addEventListener('pointercancel',e=>finish(e,false));
addEventListener('resize',measure);
init();
</script>
</body>
</html>
