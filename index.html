<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>注音上滑確認輸入測試</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--sub:#64748b;--key:#f1f5f9;--strip:#e2e8f0;--bd:#e2e8f0;--dbg:#0f172a;--pop:rgba(30,41,59,.92);--mi:#fff;--mt:#334155;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--sub:#94a3b8;--key:#334155;--strip:#0f172a;--bd:#334155;--dbg:#020617}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Noto Sans TC",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.top{padding:12px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px}
#dbg{background:var(--dbg);color:#34d399;font:12px monospace;line-height:1.6}
#dbg b{color:#fde047}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}
.row input{width:55%}
#out{font-size:24px;font-weight:700;min-height:36px;word-break:break-all}
button{border:0;border-radius:6px;padding:6px 12px;font-weight:700;background:var(--key);color:var(--tx)}
.bar{display:flex;justify-content:center;padding:12px 4px 80px;border-top:1px solid var(--bd);background:var(--card)}
#strip{display:flex;flex-direction:column;width:100%;gap:3px;padding:4px;background:var(--strip);border-radius:8px}
#buf{font-size:18px;color:#d97706;min-height:24px;letter-spacing:2px}
#cand{display:flex;flex-wrap:wrap;gap:6px;min-height:44px}
#cand button{font-size:22px;min-width:44px;height:44px;border:1px solid var(--bd)}
.kr{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.k{min-width:0;height:48px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;border-radius:6px;background:var(--key)}
.k.del{color:#dc2626}
.pop{position:fixed;z-index:9999;pointer-events:none;display:grid;grid-template-columns:repeat(3,52px);gap:6px;padding:8px;background:var(--pop);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.mi{width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;border-radius:10px;background:var(--mi);color:var(--mt)}
.mi.on{background:#3b82f6;color:#fff;transform:scale(1.1)}
.mi.empty{visibility:hidden}
</style>
</head>
<body>
<div class="top">
  <div id="dbg" class="card">
    <div>事件：<span id="d-ev">無</span></div>
    <div>進行中的筆劃：<b id="d-st">無</b></div>
    <div>手指座標：<span id="d-xy">0, 0</span></div>
  </div>
  <div class="card">
    <div class="row"><span>放大格離所按列上緣 <b id="v-gap">10px</b></span><input id="gap" type="range" min="0" max="80" step="5" value="10"></div>
    <div class="row" style="margin-top:6px"><span>跳一格所需位移 <b id="v-step">100%</b></span><input id="step" type="range" min="50" max="150" step="10" value="100"></div>
    <div class="row" style="margin-top:6px"><span>放大格位置</span><label><input id="ovl" type="checkbox"> 原位覆蓋在按鍵上</label></div>
  </div>
  <div class="card row">
    <div style="flex:1"><div style="color:var(--sub);margin-bottom:4px">輸出文字區：</div><div id="out"></div><div id="buf"></div><div id="cand"></div></div>
    <button id="clear">清空</button>
  </div>
  <div class="card" style="display:none">
    操作：一般點按會直接輸入手指下最接近的鍵（放開時輸入）。若想確認，按住後往上滑到放大字的中心，進入中心就立刻輸入。兩隻手可同時各做一筆。
  </div>
</div>

<div class="bar"><div id="strip"></div></div>

<script>
const LAYOUT=[
 ['ㄅ','ㄉ','ˇ','ˋ','ㄓ','ˊ','˙','ㄚ','ㄞ','ㄢ','ㄦ'],
 ['ㄆ','ㄊ','ㄍ','ㄐ','ㄔ','ㄗ','ㄧ','ㄛ','ㄟ','ㄣ'],
 ['ㄇ','ㄋ','ㄎ','ㄑ','ㄕ','ㄘ','ㄨ','ㄜ','ㄠ','ㄤ'],
 ['ㄈ','ㄌ','ㄏ','ㄒ','ㄖ','ㄙ','ㄩ','ㄝ','ㄡ','ㄥ']];
const MAX_STROKES=2;
const $=id=>document.getElementById(id);
const strip=$('strip'), out=$('out');
let gap=10, stepK=1, overlay=false, grid=[], rowRects=[], pitchX=29, pitchY=51;
const strokes=new Map();

$('gap').oninput=e=>{gap=+e.target.value;$('v-gap').textContent=gap+'px'};
$('step').oninput=e=>{stepK=+e.target.value/100;$('v-step').textContent=e.target.value+'%'};
$('clear').onclick=()=>{out.textContent='';buf='';render()};
$('ovl').onchange=e=>{overlay=e.target.checked};
const DICT={'ㄅㄚ':'八巴吧','ㄅㄚˊ':'拔','ㄅㄚˇ':'把','ㄅㄚˋ':'爸罷霸','ㄇㄚ':'媽','ㄇㄚˇ':'馬碼','ㄇㄚˋ':'罵','˙ㄇㄚ':'嗎麼','ㄋㄧˇ':'你','ㄋㄧˊ':'泥','ㄏㄠˇ':'好','ㄏㄠˋ':'號','ㄨㄛˇ':'我','ㄊㄚ':'他她它','ㄇㄣˊ':'們門','ㄕˋ':'是事市式','ㄕ':'師詩','ㄕˊ':'十時食','ㄕˇ':'使史','ㄉㄜˊ':'得德','˙ㄉㄜ':'的得','ㄉㄧˋ':'地第','ㄧ':'一','ㄧˇ':'以已','ㄧˋ':'意','ㄅㄨˋ':'不步','ㄗㄞˋ':'在再','ㄧㄡˇ':'有','ㄖㄣˊ':'人','ㄓㄨㄥ':'中','ㄍㄨㄛˊ':'國','ㄉㄚˋ':'大','ㄌㄞˊ':'來','ㄕㄤˋ':'上','ㄒㄧㄚˋ':'下','ㄍㄜˋ':'個','ㄇㄟˊ':'沒','˙ㄌㄜ':'了','ㄏㄨㄟˋ':'會','ㄑㄩˋ':'去','ㄓㄜˋ':'這','ㄋㄚˋ':'那','ㄧㄠˋ':'要','ㄎㄜˇ':'可','ㄊㄧㄢ':'天','ㄗㄨㄛˋ':'做坐','ㄔ':'吃','ㄏㄜ':'喝','ㄒㄧㄝˋ':'謝','ㄒㄧㄝˇ':'寫','ㄩㄝˋ':'月','ㄖˋ':'日','ㄋㄧㄢˊ':'年','ㄒㄧㄠˇ':'小','ㄕㄨㄟˇ':'水','ㄏㄨㄛˇ':'火','ㄕㄢ':'山','ㄏㄨㄚ':'花','ㄍㄠ':'高'};
let buf='';
function render(){
  $('buf').textContent=buf?'組字中：'+buf:'';
  const c=$('cand');c.innerHTML='';
  if(!buf)return;
  [...(DICT[buf]||'')].forEach(ch=>{const b=document.createElement('button');b.textContent=ch;b.onclick=()=>{out.textContent+=ch;buf='';render()};c.appendChild(b)});
  const raw=document.createElement('button');raw.textContent='↵ 原樣';raw.style.fontSize='14px';
  raw.onclick=()=>{out.textContent+=buf;buf='';render()};c.appendChild(raw);
}
function addSym(ch){buf+=ch;render()}
function delSym(){if(buf)buf=buf.slice(0,-1);else out.textContent=out.textContent.slice(0,-1);render()}

function init(){
  LAYOUT.forEach((keys,ri)=>{
    const r=document.createElement('div');r.className='kr';
    for(let i=0;i<11;i++){
      const d=document.createElement('div');
      if(i<keys.length){d.className='k';d.textContent=keys[i]}
      else if(ri===3){
        d.className='k del';d.textContent='⌫';
        d.addEventListener('pointerdown',e=>{e.stopPropagation();delSym()});
      }
      r.appendChild(d);
    }
    strip.appendChild(r);
  });
  measure();
}
function measure(){
  const rowEls=[...strip.querySelectorAll('.kr')];
  grid=rowEls.map((rowEl,ri)=>[...rowEl.children].map((el,ci)=>{
    const r=el.getBoundingClientRect();
    return{key:LAYOUT[ri][ci]||null,cx:r.left+r.width/2};
  }));
  rowRects=rowEls.map(e=>{const r=e.getBoundingClientRect();return{top:r.top,bottom:r.bottom}});
  pitchX=grid[0][1].cx-grid[0][0].cx;
  pitchY=rowRects[1].top-rowRects[0].top;
}
function pickRow(y){
  let best=0,bd=1e9;
  rowRects.forEach((r,i)=>{const d=y<r.top?r.top-y:y>r.bottom?y-r.bottom:0;if(d<bd){bd=d;best=i}});
  return best;
}
function pickCol(r,x){
  let b=0,bd=1e9;
  grid[r].forEach((cell,i)=>{if(!cell.key)return;const d=Math.abs(x-cell.cx);if(d<bd){bd=d;b=i}});
  return b;
}
// 以按下的鍵為中心，放大它周圍 3×3 的鍵
function buildPopup(st,x,y){
  const r=pickRow(y), c=pickCol(r,x);
  const kcx=grid[r][c].cx, kcy=(rowRects[r].top+rowRects[r].bottom)/2;
  Object.assign(st,{r0:r,c0:c,tiles:{},sel:'',x0:overlay?kcx:x,y0:overlay?kcy:y,sx:overlay?58:pitchX,sy:overlay?58:pitchY});
  const p=document.createElement('div');p.className='pop';
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
    const cell=grid[r+dr]&&grid[r+dr][c+dc];
    const d=document.createElement('div');
    d.className='mi'+(cell&&cell.key?'':' empty');
    d.textContent=cell&&cell.key?cell.key:'';
    p.appendChild(d);st.tiles[dr+','+dc]=d;
  }
  document.body.appendChild(p);
  const pr=p.getBoundingClientRect();
  const cxp=overlay?kcx:x;
  const left=Math.max(8,Math.min(cxp-pr.width/2,innerWidth-pr.width-8));
  const top0=overlay?kcy-pr.height/2:rowRects[r].top-gap-pr.height;
  const top=Math.max(4,Math.min(top0,innerHeight-pr.height-4));
  p.style.left=left+'px';
  p.style.top=top+'px';
  if(overlay){st.x0=left+pr.width/2;st.y0=top+pr.height/2}
  st.pop=p;
  setSel(st,0,0);
}
function setSel(st,dr,dc){
  const k=dr+','+dc;
  Object.keys(st.tiles).forEach(t=>st.tiles[t].classList.toggle('on',t===k));
  st.active=grid[st.r0+dr][st.c0+dc].key;
  st.sel=k;
}
// 手指相對按下點的位移 → 鄰近格(上下左右各最多一格)
function update(st,x,y){
  const cl=v=>Math.max(-1,Math.min(1,v));
  const dc=cl(Math.round((x-st.x0)/(st.sx*stepK)));
  const dr=cl(Math.round((y-st.y0)/(st.sy*stepK)));
  const cell=grid[st.r0+dr]&&grid[st.r0+dr][st.c0+dc];
  if(!cell||!cell.key||st.sel===dr+','+dc)return;
  setSel(st,dr,dc);
}
function show(){
  const a=[...strokes.values()].map(s=>'候選['+s.active+']');
  $('d-st').textContent=a.length?a.join(' ｜ '):'無';
}

strip.addEventListener('pointerdown',e=>{
  if(e.target.closest('.del'))return;
  if(e.isPrimary){strokes.forEach(s=>s.pop&&s.pop.remove());strokes.clear()}
  if(strokes.size>=MAX_STROKES||strokes.has(e.pointerId))return;
  strip.setPointerCapture(e.pointerId);
  measure();
  const st={pop:null,active:null};
  strokes.set(e.pointerId,st);
  buildPopup(st,e.clientX,e.clientY);
  $('d-ev').textContent='pointerdown #'+e.pointerId;
  $('d-xy').textContent=Math.round(e.clientX)+', '+Math.round(e.clientY);
  show();
});
strip.addEventListener('pointermove',e=>{
  const st=strokes.get(e.pointerId);if(!st)return;
  $('d-ev').textContent='pointermove #'+e.pointerId;
  $('d-xy').textContent=Math.round(e.clientX)+', '+Math.round(e.clientY);
  update(st,e.clientX,e.clientY);
  show();
});
function finish(e,commit){
  const st=strokes.get(e.pointerId);if(!st)return;
  if(commit&&st.active)addSym(st.active);   // 放開才輸入
  if(st.pop)st.pop.remove();
  try{strip.releasePointerCapture(e.pointerId)}catch(_){}
  strokes.delete(e.pointerId);
  $('d-ev').textContent=(commit?'pointerup':'pointercancel')+' #'+e.pointerId;
  show();
}
strip.addEventListener('pointerup',e=>finish(e,true));
strip.addEventListener('pointercancel',e=>finish(e,false));
addEventListener('resize',measure);
init();
</script>
</body>
</html>
